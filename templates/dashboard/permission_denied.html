{% extends 'base.html' %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="container" style="padding-top:5rem;padding-bottom:6rem;max-width:520px;text-align:center;">
  <div style="width:90px;height:90px;background:rgba(239,68,68,.12);border:2px solid rgba(239,68,68,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;font-size:2.25rem;">
    <i class="fa-solid fa-lock" style="color:var(--accent-red);"></i>
  </div>
  <h1 style="font-family:var(--font-display);font-size:1.75rem;font-weight:800;margin-bottom:.75rem;">Access Denied</h1>
  <p style="color:var(--text-muted);margin-bottom:.5rem;">{{ reason|default:"You don't have permission to view this page." }}</p>
  {% if perm %}
  <p style="font-size:.8rem;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:2rem;">required permission: <span style="color:var(--accent-gold);">{{ perm }}</span></p>
  {% else %}
  <div style="margin-bottom:2rem;"></div>
  {% endif %}
  <div style="display:flex;gap:1rem;justify-content:center;">
    <a href="{% url 'dashboard:home' %}" class="btn btn-secondary">
      <i class="fa-solid fa-gauge"></i> Dashboard Home
    </a>
    <a href="{% url 'products:home' %}" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Back to Store
    </a>
  </div>
</div>
{% endblock %}
