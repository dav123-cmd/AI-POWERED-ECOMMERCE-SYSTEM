<div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;padding:1.5rem;">
  <div style="background:var(--bg-secondary);border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:1/1;">
    {% if product.primary_image %}
    <img src="{{ product.primary_image.image.url }}" style="width:100%;height:100%;object-fit:contain;padding:.75rem;" />
    {% else %}
    <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;">🛍️</div>
    {% endif %}
  </div>
  <div>
    {% if product.category %}<div style="font-size:.7rem;color:var(--accent-gold);font-family:var(--font-mono);text-transform:uppercase;margin-bottom:.5rem;">{{ product.category.name }}</div>{% endif %}
    <h2 style="font-family:var(--font-display);font-size:1.25rem;font-weight:700;margin-bottom:.75rem;">{{ product.name }}</h2>
    <div style="font-family:var(--font-display);font-size:1.5rem;font-weight:800;color:var(--accent-gold);margin-bottom:1rem;">KES {{ product.effective_price|floatformat:"0" }}</div>
    <p style="font-size:.875rem;color:var(--text-secondary);line-height:1.6;margin-bottom:1.5rem;">{{ product.short_desc|default:product.description|truncatewords:30 }}</p>
    <div style="display:flex;gap:.75rem;">
      <button onclick="addToCart('{{ product.id }}',1,this)" class="btn btn-primary" style="flex:1;justify-content:center;">
        <i class="fa-solid fa-bag-shopping"></i> Add to Cart
      </button>
      <a href="{{ product.get_absolute_url }}" class="btn btn-secondary">View Full</a>
    </div>
  </div>
</div>
